name: FPL Fixtures Fetch

permissions:
  contents: write

on:
  schedule:
    # Runs daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allows you to trigger it manually from the GitHub UI for testing

jobs:
  fetch-fixtures:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: npm ci

      - name: Fetch FPL Fixtures
        run: npx tsx scripts/fetch-fixtures.ts

      - name: Commit and Push Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/fixtures-2026-27.json
          git diff --staged --quiet || git commit -m "Update FPL fixtures [skip ci]"
          git push
