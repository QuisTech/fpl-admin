name: FPL XP Data Fetch

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows you to trigger it manually from the GitHub UI for testing

jobs:
  fetch-xp:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Fetch FPL XP Data
        run: npx tsx scripts/fetch-xp.ts

      - name: Commit and Push Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/fplform.csv data/fpl_native.csv
          git diff --staged --quiet || git commit -m "Update FPL XP data [skip ci]"
          git push
