name: FPL Sniper Data Fetch

permissions:
  contents: write

on:
  schedule:
    # Runs at the top of every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allows you to trigger it manually from the GitHub UI for testing

jobs:
  snipe:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium
        
      - name: Check FPL Deadline (Sniper Window)
        id: sniper
        run: npx tsx scripts/check-deadline.ts
        
      # The subsequent steps only run if should_run was set to 'true'
      - name: Fetch FPLForm Data
        if: steps.sniper.outputs.should_run == 'true'
        run: npx tsx scripts/fetch-xp.ts

      - name: Fetch Top 1k Manager Sentiment
        if: steps.sniper.outputs.should_run == 'true'
        run: npx tsx scripts/fetch-top-1k.ts

      - name: Archive Pre-Deadline Snapshot
        if: steps.sniper.outputs.should_run == 'true'
        env:
          GOOGLE_CLOUD_PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
          GOOGLE_CLOUD_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLOUD_CLIENT_EMAIL }}
          GOOGLE_CLOUD_PRIVATE_KEY: ${{ secrets.GOOGLE_CLOUD_PRIVATE_KEY }}
        run: npx tsx scripts/save-snapshot.ts

      - name: Commit and Push New Data
        if: steps.sniper.outputs.should_run == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fplform.csv data/top_1000_eo.json data/fpl_native.csv data/snapshots/
          git diff --staged --quiet || git commit -m "Auto-update: Scraped latest FPLForm predictions, Top 1k EO & archived snapshot ~2hrs before deadline [skip ci]"
          git pull --rebase origin main
          git push


