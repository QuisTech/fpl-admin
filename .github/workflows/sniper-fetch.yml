name: FPL Sniper Data Fetch

on:
  schedule:
    # Runs at the top of every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allows you to trigger it manually from the GitHub UI for testing

jobs:
  snipe:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium
        
      - name: Check FPL Deadline (Sniper Window)
        id: sniper
        run: npx tsx scripts/check-deadline.ts
        
      # The subsequent steps only run if should_run was set to 'true'
      - name: Fetch FPLForm Data
        if: steps.sniper.outputs.should_run == 'true'
        run: npx tsx scripts/fetch-xp.ts

      - name: Fetch Top 1k Manager Sentiment
        if: steps.sniper.outputs.should_run == 'true'
        run: npx tsx scripts/fetch-top-1k.ts

      - name: Commit and Push New Data
        if: steps.sniper.outputs.should_run == 'true'
        run: |
          git config --global user.name "FPL Sniper Bot"
          git config --global user.email "bot@quistech.com"
          git add data/fplform.csv data/top_1000_eo.json
          git commit -m "Auto-update: Scraped latest FPLForm predictions and Top 1k EO 2 hours before deadline"
          git push

