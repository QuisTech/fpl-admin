name: FPL Post-Deadline Elite Intelligence Fetch

permissions:
  contents: write

on:
  schedule:
    # Runs every 30 minutes to reliably catch the post-deadline window when picks unlock
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run regardless of deadline window'
        required: false
        default: 'false'

jobs:
  post-deadline-capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Check Post-Deadline Window
        id: checker
        env:
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: node scripts/check-post-deadline.cjs

      - name: Install Dependencies
        if: steps.checker.outputs.should_run == 'true'
        run: npm ci

      - name: Capture Live Top Manager Decisions
        if: steps.checker.outputs.should_run == 'true'
        run: npx tsx scripts/capture-top-managers.ts --limit 250

      - name: Commit and Push New Decision Snapshot
        if: steps.checker.outputs.should_run == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          git diff --staged --quiet || git commit -m "Auto-update: Archived post-deadline Top Manager Decisions [skip ci]"
          git pull --rebase origin main
          git push
